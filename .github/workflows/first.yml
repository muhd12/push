name: scp files

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy files via SSH Password
        env:
          SSH_HOST: ${{ secrets.HOST }}
          SSH_USER: ${{ secrets.USERNAME }}
          SSH_PASSWORD: ${{ secrets.PASSWORD }}
          # Fallback to port 22 if secrets.PORT is empty
          SSH_PORT: ${{ secrets.PORT != '' && secrets.PORT || '22' }}
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass
          
          sshpass -p "$SSH_PASSWORD" scp -P "$SSH_PORT" -o StrictHostKeyChecking=no tests/a.txt tests/b.txt "$SSH_USER@$SSH_HOST:your_server_target_folder_path"
